[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum           = { version = "0.7", features = ["multipart"] }
tokio          = { version = "1",   features = ["rt-multi-thread", "net", "time", "sync", "io-util", "fs", "macros"] }
sqlx           = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
serde          = { version = "1",   features = ["derive"] }
serde_json     = "1"
jsonwebtoken   = "9"
argon2         = "0.5"
rand           = "0.8"
sha2           = "0.10"
aes-gcm        = "0.10"
chrono         = { version = "0.4", features = ["serde"] }
tower-http     = { version = "0.5", features = ["fs", "set-header"] }
uuid           = { version = "1",   features = ["v4"] }
anyhow         = "1"
dotenvy        = "0.15"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"
lettre         = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "tokio1", "tokio1-native-tls", "builder", "hostname"] }
printpdf       = "0.7"
zeroize        = { version = "1", features = ["derive"] }
